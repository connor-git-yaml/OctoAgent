[project]
name = "octoagent-provider"
version = "0.1.0"
description = "OctoAgent Provider -- LLM 调用抽象层"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.80,<2.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.10,<3.0",
    "structlog>=25.1,<26.0",
    "octoagent-core",
    "filelock>=3.12,<4.0",
    "python-ulid>=3.1,<4.0",
]

[tool.uv.sources]
octoagent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octoagent"]

# F137 硬闸 deny 主布线：插件必须位于 octoagent namespace 根，避免 pytest 在
# coverage 启动前为扫描 entry point 而执行整个 octoagent.provider 公开包；真正的
# gate import 延迟到 pytest_configure。octoagent/conftest.py 是冗余次选布线。
# 旧 worktree 逃生门：-p no:octoagent_model_request_gate
[project.entry-points.pytest11]
octoagent_model_request_gate = "octoagent.provider_pytest_plugin"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
